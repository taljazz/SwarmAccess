name = swarmAccess
summary = "SwarmAccess for Turtle Beach Swarm II"
description = """Makes the headset settings in Turtle Beach Swarm II usable with NVDA. Names the combo boxes and buttons, and adds a settings list: Up and Down arrows move through every switch, slider and combo box, Left and Right change them. Switches and sliders are read from the screen and changed with the mouse, so Swarm II must be visible."""
author = "taljazz"
url = https://github.com/taljazz/SwarmAccess
version = 0.4.0
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.1.0
